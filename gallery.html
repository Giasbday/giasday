<<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ede2c7;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .full-image {
            width: 100vw;
            height: 100vh;
            background-image: url('gallery.png');
            background-size: contain;  /* fits whole image without zoom or crop */
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>
</head>

<body>
    <div class="full-image"></div>
</body>
</html>
